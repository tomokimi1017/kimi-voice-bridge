<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>KIMI Voice Bridge</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020811;color:#dff8ff}
    main{width:min(560px,92vw);padding:28px;border:1px solid #168ac1;background:linear-gradient(180deg,#061727,#020a12);box-shadow:0 0 48px rgba(0,180,255,.14)}
    h1{margin:0 0 8px;font-size:22px;letter-spacing:.12em}.sub{margin:0 0 20px;color:#76bddc;font-size:12px;line-height:1.7}
    .mic-orb{width:92px;height:92px;margin:8px auto 16px;border-radius:50%;display:grid;place-items:center;border:1px solid #52d8ff;background:#07324d;font-size:36px;box-shadow:0 0 28px rgba(72,216,255,.18);transition:.2s}
    .mic-orb.active{background:#075b81;box-shadow:0 0 18px rgba(72,216,255,.55),0 0 52px rgba(72,216,255,.22);animation:pulse 1.25s ease-in-out infinite}
    .mic-orb.speaking{background:#0a4966;box-shadow:0 0 24px rgba(72,216,255,.72),0 0 64px rgba(72,216,255,.28);animation:pulse .72s ease-in-out infinite}
    @keyframes pulse{50%{transform:scale(1.06)}}
    button{width:100%;height:48px;border:1px solid #52d8ff;background:#06263a;color:#effcff;font-weight:800;letter-spacing:.06em;cursor:pointer}
    #status{margin-top:14px;text-align:center;font-size:12px;color:#8fdfff}.transcript{margin-top:14px;min-height:96px;padding:12px;border:1px solid rgba(72,216,255,.25);background:#01070c;white-space:pre-wrap;line-height:1.65}
    .note{margin-top:14px;color:#587f94;font-size:11px;line-height:1.6}
  </style>
</head>
<body>
<main>
  <h1>KIMI REALTIME VOICE</h1>
  <p class="sub">マイクとRealtime音声通話だけを担当する外部ブリッジです。APIキーやKIMI内部データはこのページには保存しません。</p>
  <div id="orb" class="mic-orb active" aria-hidden="true">🎙</div>
  <button id="mic" type="button">⏹ 音声モードを停止</button>
  <div id="status">Realtime接続を準備しています...</div>
  <div id="transcript" class="transcript"></div>
  <div class="note">SEND操作は不要です。発話終了はRealtime側のSemantic VADが判定し、KIMIの音声応答中でも話しかければ割り込みできます。</div>
</main>
<audio id="remoteAudio" autoplay></audio>
<script>
(() => {
  const mic = document.getElementById('mic');
  const orb = document.getElementById('orb');
  const status = document.getElementById('status');
  const transcript = document.getElementById('transcript');
  const remoteAudio = document.getElementById('remoteAudio');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  let desired = true;
  let rec = null;
  let recGeneration = 0;
  let recTimer = null;
  let committed = '';
  let interim = '';
  let userSpeechDetected = false;
  let modelSpeaking = false;
  let pc = null;
  let dc = null;
  let localStream = null;
  let answerApplied = false;
  let assistantTranscript = '';
  let assistantTranscriptSent = false;
  let currentResponseId = '';

  const send = (type, payload={}) => {
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({source:'KIMI_VOICE_BRIDGE',type,...payload}, '*');
    }
  };

  function paint(state, text) {
    orb.classList.toggle('active', state === 'active');
    orb.classList.toggle('speaking', state === 'speaking');
    orb.textContent = state === 'speaking' ? '◉' : (state === 'active' ? '🎙' : '🎤');
    status.textContent = text || '';
    mic.textContent = desired ? '⏹ 音声モードを停止' : '🎙 音声モードを再開';
  }

  function clearRecTimer() {
    if (recTimer) { clearTimeout(recTimer); recTimer = null; }
  }

  function stopRecognizer() {
    clearRecTimer();
    const current = rec;
    rec = null;
    recGeneration += 1;
    try { if (current) current.abort(); } catch(e) {}
  }

  function resetTranscript() {
    committed = '';
    interim = '';
    transcript.textContent = '';
  }

  function scheduleRecognizerRestart(delay=280) {
    clearRecTimer();
    if (!desired) return;
    recTimer = setTimeout(() => { recTimer = null; startRecognizer(false); }, delay);
  }

  function extractAssistantTranscript(event) {
    const response = event && event.response;
    const chunks = [];
    ((response && response.output) || []).forEach(item => {
      (item.content || []).forEach(part => {
        if (part && typeof part.transcript === 'string' && part.transcript) chunks.push(part.transcript);
        else if (part && typeof part.text === 'string' && part.text) chunks.push(part.text);
      });
    });
    return chunks.join('').trim();
  }

  function emitAssistantTranscript(candidate='') {
    const text = String(candidate || assistantTranscript || '').trim();
    if (!text || assistantTranscriptSent) return;
    assistantTranscript = text;
    assistantTranscriptSent = true;
    send('assistant-transcript',{text,responseId:currentResponseId});
  }

  // Browser SpeechRecognition is used only for on-screen text mirroring.
  // Realtime itself consumes the microphone audio directly through WebRTC.
  function startRecognizer(reset=false) {
    if (!SR || !desired || rec) return;
    if (reset) resetTranscript();
    const gen = ++recGeneration;
    const local = new SR();
    rec = local;
    local.lang = 'ja-JP';
    local.interimResults = true;
    local.continuous = true;

    local.onresult = e => {
      if (rec !== local || gen !== recGeneration || !desired) return;
      if (modelSpeaking && !userSpeechDetected) return;
      let nextInterim = '';
      for (let i=e.resultIndex;i<e.results.length;i++) {
        const part = e.results[i][0].transcript || '';
        if (e.results[i].isFinal) committed = (committed + ' ' + part).trim();
        else nextInterim += part;
      }
      interim = nextInterim;
      const text = (committed + ' ' + interim).trim();
      transcript.textContent = text;
      send('transcript',{text,final:!interim});
    };

    local.onerror = e => {
      if (rec !== local || gen !== recGeneration) return;
      const code = e && e.error ? e.error : 'unknown';
      rec = null;
      if (code === 'no-speech' || code === 'aborted') {
        scheduleRecognizerRestart(320);
        return;
      }
      send('stt-warning',{error:code});
    };

    local.onend = () => {
      if (rec !== local || gen !== recGeneration) return;
      rec = null;
      scheduleRecognizerRestart(280);
    };

    try { local.start(); }
    catch(e) { rec = null; scheduleRecognizerRestart(420); }
  }

  function waitForIceGathering(connection) {
    if (connection.iceGatheringState === 'complete') return Promise.resolve();
    return new Promise(resolve => {
      const done = () => {
        if (connection.iceGatheringState === 'complete') {
          connection.removeEventListener('icegatheringstatechange', done);
          resolve();
        }
      };
      connection.addEventListener('icegatheringstatechange', done);
      setTimeout(() => {
        connection.removeEventListener('icegatheringstatechange', done);
        resolve();
      }, 1800);
    });
  }

  function handleRealtimeEvent(event) {
    const type = String(event && event.type || '');
    if (!type) return;

    if (type === 'input_audio_buffer.speech_started') {
      userSpeechDetected = true;
      committed = '';
      interim = '';
      transcript.textContent = '';
      paint('active', modelSpeaking ? '割り込みを聞いています...' : 'LISTENING...');
      send('status',{active:true,status:'LISTENING',realtime:true});
      return;
    }

    if (type === 'input_audio_buffer.speech_stopped') {
      setTimeout(() => {
        const text = (committed + ' ' + interim).trim();
        if (text) send('user-turn-final',{text});
      }, 260);
      return;
    }

    if (type === 'response.created') {
      modelSpeaking = true;
      userSpeechDetected = false;
      assistantTranscript = '';
      assistantTranscriptSent = false;
      currentResponseId = String(event && event.response && event.response.id || '');
      paint('speaking','KIMIが話しています...');
      send('status',{active:true,status:'SPEAKING',realtime:true});
      return;
    }

    if (type === 'response.output_audio_transcript.delta') {
      assistantTranscript += String(event.delta || '');
      return;
    }

    if (type === 'response.output_audio_transcript.done') {
      emitAssistantTranscript(event.transcript || assistantTranscript);
      return;
    }

    if (type === 'response.content_part.done') {
      const part = event.part || {};
      if (typeof part.transcript === 'string' && part.transcript) assistantTranscript = part.transcript;
      else if (typeof part.text === 'string' && part.text) assistantTranscript = part.text;
      return;
    }

    if (type === 'response.output_item.done') {
      const item = event.item || {};
      (item.content || []).forEach(part => {
        if (part && typeof part.transcript === 'string' && part.transcript) assistantTranscript = part.transcript;
        else if (part && typeof part.text === 'string' && part.text) assistantTranscript = part.text;
      });
      return;
    }

    if (type === 'response.done') {
      // Audio output always has a transcript. Some interrupted/fast responses can
      // reach response.done without the dedicated transcript.done handler being
      // observed by the bridge, so flush the accumulated/final response transcript
      // here before clearing per-response state.
      emitAssistantTranscript(extractAssistantTranscript(event));
      modelSpeaking = false;
      userSpeechDetected = false;
      assistantTranscript = '';
      assistantTranscriptSent = false;
      currentResponseId = '';
      paint('active','LISTENING...');
      send('status',{active:true,status:'LISTENING',realtime:true});
      return;
    }

    if (type === 'error') {
      const err = event.error || {};
      send('error',{error:String(err.code || err.type || err.message || 'realtime_error')});
    }
  }

  async function startRealtime() {
    try {
      paint('off','マイクを起動しています...');
      localStream = await navigator.mediaDevices.getUserMedia({
        audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
        video:false
      });

      if (!desired) return;
      pc = new RTCPeerConnection();
      pc.ontrack = e => {
        const stream = e.streams && e.streams[0];
        if (stream) {
          remoteAudio.srcObject = stream;
          remoteAudio.play().catch(() => {});
        }
      };
      pc.onconnectionstatechange = () => {
        if (!pc) return;
        const state = pc.connectionState;
        send('rtc-state',{state});
        if (state === 'connected') {
          paint('active','LISTENING...');
          send('status',{active:true,status:'LISTENING',realtime:true});
        }
        if (state === 'failed' || state === 'disconnected') {
          send('error',{error:'webrtc_' + state});
        }
      };

      localStream.getAudioTracks().forEach(track => pc.addTrack(track, localStream));
      dc = pc.createDataChannel('oai-events');
      dc.onopen = () => {
        paint('active','LISTENING...');
        send('status',{active:true,status:'LISTENING',realtime:true});
      };
      dc.onmessage = e => {
        try { handleRealtimeEvent(JSON.parse(e.data)); } catch(ignore) {}
      };
      dc.onerror = () => send('error',{error:'realtime_datachannel'});

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitForIceGathering(pc);
      const sdp = pc.localDescription && pc.localDescription.sdp;
      if (!sdp) throw new Error('sdp_offer_missing');
      paint('off','KIMI Realtimeへ接続しています...');
      send('realtime-offer',{sdp});
      startRecognizer(true);
    } catch(e) {
      send('error',{error:String(e && e.message ? e.message : e || 'realtime_start_failed')});
      paint('off','ERROR: ' + String(e && e.message ? e.message : e));
    }
  }

  async function applyRealtimeAnswer(sdp) {
    try {
      if (!pc || answerApplied) return;
      answerApplied = true;
      await pc.setRemoteDescription({type:'answer',sdp:String(sdp || '')});
      paint('active','Realtime接続中...');
    } catch(e) {
      send('error',{error:'remote_sdp_' + String(e && e.message ? e.message : 'failed')});
    }
  }

  function stopMode(notify=true) {
    desired = false;
    stopRecognizer();
    try { if (dc) dc.close(); } catch(e) {}
    dc = null;
    try { if (pc) pc.close(); } catch(e) {}
    pc = null;
    if (localStream) {
      localStream.getTracks().forEach(t => { try { t.stop(); } catch(e) {} });
      localStream = null;
    }
    try { remoteAudio.pause(); remoteAudio.srcObject = null; } catch(e) {}
    modelSpeaking = false;
    assistantTranscript = '';
    assistantTranscriptSent = false;
    currentResponseId = '';
    paint('off','STOPPED');
    if (notify) send('status',{active:false,status:'STOPPED',realtime:true});
  }

  function restartMode() {
    stopMode(false);
    desired = true;
    answerApplied = false;
    resetTranscript();
    paint('off','担当コンテキストを切り替えています...');
    setTimeout(startRealtime, 90);
  }

  mic.addEventListener('click', () => {
    if (desired) {
      stopMode(true);
    } else {
      desired = true;
      answerApplied = false;
      resetTranscript();
      startRealtime();
    }
  });

  window.addEventListener('message', e => {
    const data = e.data || {};
    if (data.source !== 'KIMI_OS') return;
    if (data.type === 'realtime-answer') applyRealtimeAnswer(data.sdp);
    if (data.type === 'restart') restartMode();
    if (data.type === 'stop') stopMode(true);
  });

  window.addEventListener('beforeunload', () => stopMode(false));

  send('ready',{autostart:true,realtime:true});
  setTimeout(startRealtime, 60);
})();
</script>
</body>
</html>
